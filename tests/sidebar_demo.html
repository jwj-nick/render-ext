<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>render-ext sidebar demo</title>
<link rel="stylesheet" href="../app/libs/github-markdown.min.css">
<link rel="stylesheet" href="../app/styles/hljs-theme.css">
<link rel="stylesheet" href="../app/styles/sidebar.css">
<link rel="stylesheet" href="../app/styles/base.css">
<style> html { background:#fff; } </style>
</head>
<body>
  <!-- open this file via file:// so the Files panel can list the tests/ folder -->
  <article id="doc" class="markdown-body rx-md-root">
    <h1 id="sidebar-demo">Sidebar Demo</h1>
    <p>이 페이지를 <code>file://</code> 로 열면 왼쪽에 Files(이 폴더 목록)와
       Contents(아래 제목들) 탭이 나타납니다. Files에서 폴더/문서를 클릭해 이동.</p>
    <h2 id="section-a">Section A</h2>
    <p>내용 A. 스크롤하면 목차의 활성 항목이 따라 바뀝니다.</p>
    <h3 id="a-1">A.1 detail</h3>
    <p>내용 A.1</p>
    <h2 id="section-b">Section B</h2>
    <p>내용 B</p>
    <h3 id="b-1">B.1 detail</h3>
    <p style="height:600px">내용 B.1 (여백)</p>
    <h2 id="section-c">Section C</h2>
    <p style="height:600px">내용 C (여백)</p>
  </article>

  <script src="../app/common/registry.js"></script>
  <script src="../app/render/sidebar.js"></script>
  <script>
    document.documentElement.classList.add('rx-page');
    // ?files -> mount as a "code" file (Files-only) to preview directory listing
    const filesOnly = location.search.includes('files');
    rxMountSidebarNow({
      kind: filesOnly ? 'code' : 'markdown',
      tocRoot: filesOnly ? null : document.getElementById('doc')
    });
  </script>
</body>
</html>
